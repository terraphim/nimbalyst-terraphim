name: Nimbalyst component checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nimbalyst-components-${{ github.ref }}
  cancel-in-progress: true
jobs:
  components:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_BROWSERS_PATH: .cache/browsers
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.10.0
          cache: npm
      - name: Record component runtime and install locked dependencies
        run: |
          mkdir -p .artifacts .cache
          node --input-type=module -e 'import fs from "node:fs"; fs.writeFileSync(".artifacts/runtime.json", JSON.stringify({scope:"component checks only; not native Nimbalyst qualification or release",source:process.env.GITHUB_SHA,node:process.version,platform:process.platform,arch:process.arch},null,2)+"\n")'
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps --only-shell chromium
      - name: Verify exact published Editor RC2 test dependency
        run: |
          set -o pipefail
          curl --fail --location --retry 2 --output .cache/editor-candidate.tar.gz https://github.com/terraphim/terraphim-editor/releases/download/v0.1.0-rc.2/editor-candidate.tar.gz
          npm run prepare:recovery-assets -- .cache/editor-candidate.tar.gz 2>&1 | tee .artifacts/prepare-assets.log
      - name: Check strict types and actual filesystem boundaries
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee .artifacts/typecheck.log
          npm run test:source 2>&1 | tee .artifacts/source-tests.log
      - name: Test actual browser, IndexedDB, Rust WASM and file readbacks
        run: |
          set -o pipefail
          unset NO_COLOR
          npm run test:recovery 2>&1 | tee .artifacts/browser-tests.log
      - name: Verify and retain the development candidate package
        run: |
          set -o pipefail
          python3 --version | tee .artifacts/package-python.log
          npm run test:native-package 2>&1 | tee .artifacts/package-tests.log
          npm run package:candidate -- --output .artifacts/native-package/terraphim-editor-0.1.0-dev.1.nimext 2>&1 | tee .artifacts/package-build.log
      - name: Validate closed release admission contracts
        run: python3 -W error -m unittest discover -s tests/release -v
      - name: Seal the single original CI candidate for later native qualification
        if: matrix.os == 'ubuntu-24.04'
        run: python3 scripts/release/candidate.py seal --package .artifacts/native-package/terraphim-editor-0.1.0-dev.1.nimext --destination .artifacts/release-candidate
      - name: Retain original qualification input by immutable artifact identity
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qualified-input-${{ github.sha }}-${{ github.run_attempt }}
          path: .artifacts/release-candidate/
          if-no-files-found: error
      - name: Retain actual component evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: component-evidence-${{ matrix.os }}-${{ github.sha }}
          path: .artifacts/
          include-hidden-files: true
          if-no-files-found: error
