name: Publish qualified Nimbalyst artifact
on:
  workflow_dispatch:
    inputs:
      admission_commit:
        description: Reviewed canonical-main commit containing release/qualified.json and sanitized evidence
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: nimbalyst-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse unqualified or mismatched publication inputs
        env:
          GH_TOKEN: ${{ github.token }}
          ADMISSION_COMMIT: ${{ inputs.admission_commit }}
        run: python3 scripts/release/deliver.py prepare --admission-commit "$ADMISSION_COMMIT" --destination "$RUNNER_TEMP/nimbalyst-admission"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/nimbalyst-admission/preflight.json
            ${{ runner.temp }}/nimbalyst-admission/failure.json
          if-no-files-found: error
  publish:
    needs: admission
    environment: nimbalyst-release
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Revalidate original artifact and publish without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          ADMISSION_COMMIT: ${{ inputs.admission_commit }}
        run: |
          python3 scripts/release/deliver.py prepare --admission-commit "$ADMISSION_COMMIT" --destination "$RUNNER_TEMP/nimbalyst-publication"
          python3 scripts/release/deliver.py publish --destination "$RUNNER_TEMP/nimbalyst-publication"
      - name: Preserve exact public response evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-readback-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/nimbalyst-publication/preflight.json
            ${{ runner.temp }}/nimbalyst-publication/public-readback.json
            ${{ runner.temp }}/nimbalyst-publication/failure.json
            ${{ runner.temp }}/nimbalyst-publication/anonymous-readback/
          if-no-files-found: warn
